<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Pia</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="avatar" aria-label="Pia Avatar" id="avatar"></div>
      <div class="title">Pia</div>
    </header>

    <main class="chat" id="chat" aria-label="Chat">
      <div class="msg msg-assistant">
        <div class="bubble"></div>
      </div>
      <div class="msg msg-user">
        <div class="bubble"></div>
      </div>
    </main>

    <footer class="composer">
      <input type="text" id="input" placeholder="" autocomplete="off" aria-label="Nachricht" />
      <button type="button" id="send" aria-label="Senden">→</button>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
